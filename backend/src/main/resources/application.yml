spring:
  application:
    name: inhaMatch

  datasource:
    url: jdbc:postgresql://localhost:5433/inhamatch
    username: ${DB_USERNAME:inhamatch}
    password: ${DB_PASSWORD:inhamatch}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:inhaMatch-local-dev-secret-key-32chars-minimum}
  access-token-validity-ms: 3600000
  refresh-token-validity-ms: 1209600000

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth/callback}